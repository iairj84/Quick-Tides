name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Project sites live at https://<owner>.github.io/<repo>/ while a
      # <owner>.github.io repo is served from the domain root. Vite and the
      # router both need the matching prefix.
      - name: Work out the base path
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            base="/"
          else
            base="/${{ github.event.repository.name }}/"
          fi
          echo "VITE_BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "Building for $base"

      - name: Build
        run: bun run build:pages

      # GitHub Pages has no SPA rewrites. Unknown paths are answered with
      # 404.html, so give it the app shell and let the router take over.
      - name: Add the SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
